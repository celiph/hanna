<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#edf1f5;--card:#ffffff;--ink:#14213d;--muted:#5f6b7e;--line:#d9e0e8;
  --pink:#ff7a1a;--pink-soft:#ffe8d6;--blue:#ff7a1a;--blue-soft:#ffe8d6;--ok:#17936a;--ok-soft:#d9f3e9;
  --accent:var(--pink);--far:#a9b4c4;--ghost:#dde3ea;--prop:#e4e9ef;--propd:#4a5568;
  --tile:#f4f7fa;
  /* Einheitliche Maße: Rundungen, Rahmen, Abstände */
  --r-lg:16px;--r-md:12px;--r-sm:8px;--bw:1.5px;--gap:8px;--sp:16px;--hit:44px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f1626;--card:#182238;--ink:#eaf0f7;--muted:#97a3b6;--line:#26324a;
  --pink-soft:#3a2414;--blue-soft:#3a2414;--ok-soft:#12352a;--ok:#3ccf98;
  --far:#5a6880;--ghost:#222d44;--prop:#26324a;--propd:#b3bfd1;--tile:#121b2e;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.ex,.sheet,.tabs,.seg,.filters{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:24px var(--sp) var(--sp)}

/* Kopf */
header{margin:0 0 24px;height:72px}
header h1{color:var(--pink);font:900 72px/1 "Big Shoulders Display",sans-serif;letter-spacing:.01em}

/* Art: Kraft / Plyometrisch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:var(--sp)}
.seg button{border:var(--bw) solid var(--line);background:var(--card);font:800 22px/1 "Big Shoulders Display",sans-serif;letter-spacing:.02em;padding:14px 12px 12px;border-radius:var(--r-md);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.seg button svg{width:24px;height:24px;flex:none;color:var(--c)}
.seg button[data-cat="kraft"]{--c:var(--pink)}
.seg button[data-cat="plyo"]{--c:var(--blue)}
.seg button.active{background:var(--c);border-color:var(--c);color:#fff}
.seg button.active svg{color:#fff}

/* Kleine Beschriftungen */
.flabel,.count{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 var(--gap) 2px}
.filters{display:flex;gap:var(--gap);overflow-x:auto;margin:0 calc(-1*var(--sp)) var(--sp);padding:0 var(--sp) 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters{--fl:0px;--fr:56px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.filters.scrolled{--fl:40px}
.filters.at-end{--fr:0px}
.chip{border:var(--bw) solid var(--line);background:var(--card);font:600 15px/1 Figtree,sans-serif;padding:10px 16px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Übungskarten */
.list{display:flex;flex-direction:column;gap:var(--gap)}
.ex{--c:var(--pink);background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:var(--gap) 12px var(--gap) var(--gap);display:flex;gap:12px;align-items:center}
.ex.selected{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.ex.done .ex-title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.ex.done .fig{opacity:.5}
.fig{width:100px;height:100px;flex:none;border-radius:var(--r-md);background:var(--tile);cursor:pointer;border:0;padding:0;display:block;overflow:hidden}
.fig svg{width:100%;height:100%;display:block}
.ex-body{flex:1;min-width:0;cursor:pointer}
.ex-title{font:700 17px/1.25 Figtree,sans-serif}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--gap)}
.tag{font:600 13px/1 Figtree,sans-serif;color:var(--muted);background:var(--tile);padding:5px 10px;border-radius:var(--r-sm)}
.toggle,.check{flex:none;width:var(--hit);height:var(--hit);border:var(--bw) solid var(--line);border-radius:50%;background:transparent;font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center;line-height:1}
.check{color:transparent}
.ex.selected .toggle,.ex.done .check{background:var(--ok);border-color:var(--ok);color:#fff}

/* Training */
.progress{margin-bottom:var(--sp)}
.progress-top{display:flex;justify-content:flex-end;align-items:baseline;margin-bottom:var(--gap)}
.progress-top .sub{font:800 22px/1 "Big Shoulders Display",sans-serif;color:var(--ink)}
.bar{height:14px;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.18) 9px 10px);transition:width .35s ease}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:16px;line-height:1.55;border:var(--bw) dashed var(--line);border-radius:var(--r-lg)}
.row{display:flex;gap:var(--gap);margin-top:var(--sp)}
.btn{flex:1;border-radius:var(--r-md);padding:14px;font:600 15px/1.2 Figtree,sans-serif;cursor:pointer;background:var(--card);border:var(--bw) solid var(--line)}
.done-banner{background:var(--ok-soft);color:var(--ok);border-radius:var(--r-lg);padding:var(--sp);font-weight:700;font-size:16px;margin-bottom:var(--sp);display:none}

/* Navigation unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:var(--gap);padding:10px max(var(--sp),calc(50% - 294px)) calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:var(--bw) solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:800 22px/1 "Big Shoulders Display",sans-serif;letter-spacing:.02em;padding:14px 12px 12px;border-radius:var(--r-md);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--gap)}
.tab.active{background:var(--ink);color:var(--paper)}

/* Detailansicht */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:var(--sp)}
.overlay.open{display:flex}
.sheet{position:relative;background:var(--card);width:100%;max-width:620px;border-radius:var(--r-lg);padding:var(--sp) var(--sp) 24px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto}
.sheet .x{position:absolute;top:var(--sp);right:var(--sp);width:var(--hit);height:var(--hit);border-radius:50%;border:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:2}
.sheet .x svg{width:20px;height:20px}
.sheet .big{width:100%;max-width:360px;aspect-ratio:1;margin:0 auto var(--sp);background:var(--tile);border-radius:var(--r-md);overflow:hidden}
.sheet .big svg{width:100%;height:100%;display:block}
.sheet h2{font:800 32px/1.05 "Big Shoulders Display",sans-serif;margin-bottom:var(--gap)}
.sheet p{color:var(--muted);line-height:1.55;margin-top:var(--sp);font-size:16px;max-width:60ch}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hanna">
<meta name="theme-color" content="#14213d">
</head>
<body>
<div class="wrap">
  <header><h1>Hanna</h1></header>

  <section id="view-library">
    <div class="seg" id="seg"></div>
    <div class="flabel">Gerät</div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="list" id="library"></div>
  </section>

  <section id="view-training" hidden>
    <div class="done-banner" id="doneBanner">Alles abgehakt. Training geschafft!</div>
    <div class="progress" id="progressBox">
      <div class="progress-top"><span class="sub" id="progressText">0 / 0</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="list" id="training"></div>
    <div class="row" id="trainingActions">
      <button class="btn" id="resetChecks">Haken zurücksetzen</button>
      <button class="btn" id="clearPlan">Plan leeren</button>
    </div>
  </section>
</div>

<nav class="tabs">
  <button class="tab active" data-view="library">Übungen</button>
  <button class="tab" data-view="training">Training</button>
</nav>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// Strichmännchen-Engine: Posen aus absoluten Winkeln (0 = nach unten, 90 = nach vorne/rechts, 180 = nach oben)
const SEG = {torso:44, neck:5, head:8, ua:21, fa:20, th:29, sh:29, ft:10};
const GY = 183;
function dir(a){const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)];}
function add(p,a,len){const d=dir(a);return [p[0]+d[0]*len,p[1]+d[1]*len];}
const lerp=(a,b,t)=>a+(b-a)*t;

function skeleton(p, front){
  const P={};
  const td=dir(p.t), perp=[-td[1],td[0]]; // zeigt bei aufrechtem Oberkörper nach rechts
  const hw=front?7:0, sw=front?11:0;
  P.hip=[0,0];
  P.sh=add(P.hip,p.t,SEG.torso);
  P.head=add(P.sh,p.t+(p.hd||0),SEG.neck+SEG.head);
  const hipN=[perp[0]*hw,perp[1]*hw], hipF=[-perp[0]*hw,-perp[1]*hw];
  const shN=[P.sh[0]+perp[0]*sw,P.sh[1]+perp[1]*sw], shF=[P.sh[0]-perp[0]*sw,P.sh[1]-perp[1]*sw];
  P.hipN=hipN;P.hipF=hipF;P.shN=shN;P.shF=shF;
  for(const s of ['N','F']){
    const l=p[s==='N'?'nl':'fl'], a=p[s==='N'?'na':'fa'];
    const hp=s==='N'?hipN:hipF, sp=s==='N'?shN:shF;
    const sc=p[s==='N'?'nls':'fls']||[1,1];
    P['knee'+s]=add(hp,l[0],SEG.th*sc[0]);
    P['ankle'+s]=add(P['knee'+s],l[1],SEG.sh*sc[1]);
    const fl=SEG.ft*(front?0.75:1)*((s==='N'&&p.fs)||1)*(p.ff||1);
    P['toe'+s]=add(P['ankle'+s],l[2],fl);
    P['heel'+s]=add(P['ankle'+s],l[2]+180,front?1:3);
    P['elbow'+s]=add(sp,a[0],SEG.ua);
    P['hand'+s]=add(P['elbow'+s],a[1],SEG.fa);
    P['foot'+s]=[lerp(P['heel'+s][0],P['toe'+s][0],.5),lerp(P['heel'+s][1],P['toe'+s][1],.5)];
    P['thigh'+s]=[lerp(hp[0],P['knee'+s][0],.72),lerp(hp[1],P['knee'+s][1],.72)];
  }
  P.mid=[(P.handN[0]+P.handF[0])/2,(P.handN[1]+P.handF[1])/2];
  return P;
}
const GROUND_PTS=['toeN','toeF','heelN','heelF','kneeN','kneeF','handN','handF','elbowN','elbowF','hip','sh'];
function place(p, front){
  const P=skeleton(p,front);
  const gy=p.gy??GY;
  let ref;
  if(p.g) ref=P[p.g][1];
  else { ref=-1e9; for(const k of GROUND_PTS) ref=Math.max(ref,P[k][1]); ref=Math.max(ref,P.head[1]+SEG.head); }
  if(p.hy!=null) return {x:p.x??100, y:p.hy-(p.air||0)};
  return {x:p.x??100, y:gy-ref-(p.air||0)};
}
// Fuß fest an einem Punkt halten (z. B. hinterer Fuß auf der Box)
function solveLeg(p,leg,A,ft,fwd){
  const L1=SEG.th,L2=SEG.sh, H=[p._x,p._y];
  const vx=A[0]-H[0], vy=A[1]-H[1]; let d=Math.hypot(vx,vy); d=Math.min(Math.max(d,4),L1+L2-0.01);
  const a0=Math.atan2(vx,vy)*180/Math.PI;
  const al=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d))*180/Math.PI;
  const key=leg==='N'?'nl':'fl';
  // Knie zeigt bei 'N' nach vorne, bei 'F' nach unten
  let best=null;
  for(const th of [a0+al,a0-al]){const kn=add(H,th,L1);const sc=(leg==='N'||fwd)?kn[0]:kn[1];if(!best||sc>best.sc)best={th,kn,sc};}
  const sh=Math.atan2(A[0]-best.kn[0],A[1]-best.kn[1])*180/Math.PI;
  return {...p,[key]:[best.th,sh,ft]};
}
function pinLeg(S,p){
  if(!S.ik) return p;
  for(const k of [].concat(S.ik)){
    const key=k.leg==='N'?'nl':'fl', ft=k.ft??p[key][2];
    const A=k.toe?add(k.toe,ft+180,SEG.ft):k.ankle;
    p=solveLeg(p,k.leg,A,ft,k.fwd);
  }
  return p;
}
// Keyframes vorbereiten: Hüftposition je Keyframe, Schatten-Posen, Bildausschnitt
function prep(spec){
  const front=spec.v==='front';
  const kf=spec.kf.map(k=>{let q={...k};const o=place(q,front);q._x=o.x;q._y=o.y;q=pinLeg(spec,q);return q;});
  const S={...spec,front,kf};
  // Schatten: Startpose + die am stärksten abweichende Pose
  const diff=(a,b)=>{let d=Math.abs(a._x-b._x)+Math.abs(a._y-b._y)+Math.abs(a.t-b.t);for(const k of ['na','fa','nl','fl'])a[k].forEach((v,i)=>d+=Math.abs(v-b[k][i]));return d;};
  let mi=0,md=-1;kf.forEach((k,i)=>{const d=diff(kf[0],k);if(d>md){md=d;mi=i;}});
  S.ghosts=[...new Set([0,mi])].map(i=>interp(kf[i],kf[i],0));
  // Bildausschnitt aus allen Positionen der Bewegung
  let x0=1e9,x1=-1e9,y0=1e9,y1=GY+7;
  const inc=(x,y)=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y+4);};
  const dur=S.d||1600;
  for(let i=0;i<40;i++){
    const p=poseAt(S,dur*i/40), P=skeleton(p,front);
    for(const k in P){inc(P[k][0]+p._x,P[k][1]+p._y);}
    inc(P.head[0]+p._x-SEG.head,P.head[1]+p._y-SEG.head-2);inc(P.head[0]+p._x+SEG.head,P.head[1]+p._y);
    for(const pr of S.props||[]) if(pr[0]==='kb'||pr[0]==='db'){const q=P[pr[1]||'handN']||P.handN;inc(q[0]+p._x-10,q[1]+p._y-8);inc(q[0]+p._x+10,q[1]+p._y);}
  }
  for(const pr of S.props||[]){const [t,a,b,c]=pr;
    if(t==='box'||t==='bench'||t==='boxBack'){inc(a,GY-c-10);inc(a+b,GY);} if(t==='step'){inc(a,GY-12);inc(a+b,GY);}
    if(t==='plate'){inc(a-17,GY);inc(a+17,GY);}
    if(t==='plateFront'){inc(a-20,GY+12);inc(a+20,GY+12);} if(t==='wall'){inc(a-3,GY);}
  }
  const pad=9, bottom=y1;
  let w=x1-x0+pad*2, h=bottom-(y0-pad);
  const size=Math.max(w,h,90);
  const cx=(x0+x1)/2;
  S.vb=[cx-size/2,bottom-size,size,size].map(v=>+v.toFixed(1));
  return S;
}
function interp(a,b,t){
  const o={};
  for(const k of ['t','hd','fs','ff']) o[k]=lerp(a[k]??(k==='fs'||k==='ff'?1:0),b[k]??(k==='fs'||k==='ff'?1:0),t);
  o.kbw=lerp(a.kbw??1,b.kbw??1,t);
  o.kbz=lerp(a.kbz??0,b.kbz??0,t);
  for(const k of ['na','fa','nl','fl']) o[k]=a[k].map((v,i)=>lerp(v,b[k][i],t));
  for(const k of ['nls','fls']){const A=a[k]||[1,1],B=b[k]||[1,1];o[k]=[lerp(A[0],B[0],t),lerp(A[1],B[1],t)];}
  o._x=lerp(a._x,b._x,t);o._y=lerp(a._y,b._y,t);
  return o;
}
function poseAt(S,time){
  const n=S.kf.length, dur=S.d||1600;
  const w=S.kf.map(k=>k.w||1), tot=w.reduce((a,b)=>a+b,0);
  let u=((time%dur)/dur)*tot, i=0;
  while(i<n-1&&u>w[i]){u-=w[i];i++;}
  const a=S.kf[i], b=S.kf[(i+1)%n];
  let t=u/w[i];
  const h=a.hold??S.hold??0;            // kurze Pause an jeder Umkehrposition
  t=t<h?0:(t-h)/(1-h);
  const e=a.lin?t:(1-Math.cos(Math.PI*t))/2;
  let o=interp(a,b,e);
  // Zwischen zwei Bodenposen auf gleicher Höhe die Füße am Boden halten (kein Einsinken)
  if(!a.air&&!b.air&&a.hy==null&&b.hy==null&&(a.gy??GY)===(b.gy??GY)&&(a.g||'')===(b.g||'')){
    const q=place({...o,g:a.g,gy:a.gy},S.front);o._y=q.y;
  }
  return pinLeg(S,o);
}
const C={ink:'var(--ink)',far:'var(--far)',ghost:'var(--ghost)',acc:'var(--accent)',eqF:'var(--pink-soft)',prop:'var(--prop)',propD:'var(--propd)',floor:'var(--line)'};
function pt(P,o,name){
  if(Array.isArray(name)) return name;
  const q=P[name];return [q[0]+o[0],q[1]+o[1]];
}
const f1=v=>v.toFixed(1);
const L=(a,b,c,w=5)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const PL=(pts,c,w=5)=>`<polyline points="${pts.map(q=>f1(q[0])+','+f1(q[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function body(S,p,cNear,cFar,ghost){
  const P=skeleton(p,S.front), o=[p._x,p._y], g=n=>pt(P,o,n);
  const lw=ghost?4:5;
  const limb=(s,c)=>PL([g(s==='N'?'hipN':'hipF'),g('knee'+s),g('ankle'+s)],c,lw)+L(g('heel'+s),g('toe'+s),c,lw-.5)+PL([g(s==='N'?'shN':'shF'),g('elbow'+s),g('hand'+s)],c,lw-.5);
  const dots=(s,c)=>ghost?'':['knee','elbow'].map(j=>{const q=g(j+s);return `<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="3.6" fill="${c}"/>`;}).join('');
  let out=limb('F',cFar)+dots('F',cFar);
  out+=L(g('hip'),g('sh'),cNear,lw+.5);
  if(S.front){out+=L(g('hipF'),g('hipN'),cNear,lw);out+=L(g('shF'),g('shN'),cNear,lw);}
  const h=g('head');
  out+=`<circle cx="${f1(h[0])}" cy="${f1(h[1])}" r="${SEG.head}" fill="${cNear}"/>`;
  out+=limb('N',cNear)+dots('N',cNear);
  return {svg:out,g};
}
function renderFig(S,time,col=C){
  const p=poseAt(S,time);
  let back=S.noFloor?'':`<line x1="-60" y1="${GY+2}" x2="260" y2="${GY+2}" stroke="${col.floor}" stroke-width="3" stroke-linecap="round"/>`, held='';
  for(const gp of S.ghosts||[]) back+=body(S,gp,col.ghost,col.ghost,true).svg;
  const B=body(S,p,col.ink,(S.front&&!S.fm)?col.ink:col.far,false), g=B.g;
  let under='';
  for(const pr of S.props||[]){
    const [t,...a]=pr;

  kraft:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="10.8" width="10" height="2.4" rx="1" fill="currentColor"/><rect x="3.6" y="6.5" width="3.6" height="11" rx="1.3" fill="currentColor"/><rect x="16.8" y="6.5" width="3.6" height="11" rx="1.3" fill="currentColor"/><rect x="1.2" y="9" width="2.6" height="6" rx="1" fill="currentColor"/><rect x="20.2" y="9" width="2.6" height="6" rx="1" fill="currentColor"/></svg>',

// Hauptgerät einer Übung (erstes Gerät alphabetisch, sonst 'Ohne')
// Feste Reihenfolge innerhalb einer Gerätegruppe (sonst alphabetisch)
const KRANK={x1:1,x33:2,x11:3,x9:4,x15:5,x27:6,x58:7,x23:8,x5:9,x57:10,x10:11,x68:12,x31:13,x25:14,x26:15,x60:16,x8:17,x4:18,x35:19,x34:20,x41:21,x44:22,x45:23,x69:24,x46:25,x42:26,x70:27};
const RANK={x61:1,x62:2,x52:3,x63:4,x67:5,x22:6,x24:7};
const mainEquip=e=>e.equip.length?[...e.equip].sort()[0]:'Ohne';
const CATEGORIES=[{id:'kraft',label:'Kraft'},{id:'plyo',label:'Plyometrisch'}];
const EQUIPMENT=['Box','Hantelscheibe','Kettlebell','Kurzhanteln','Ohne','Stepper','Widerstandsband']; // alphabetisch, 'Ohne' = ohne Gerät
const BY_ID=Object.fromEntries(EXERCISES.map(e=>[e.id,{...e,S:prep(e.anim)}]));
const KEY='laeuferknie-v4';
let state=load(), catFilter='kraft', equipFilter='';

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.plan))return {plan:s.plan.filter(id=>BY_ID[id]),done:(s.done||[]).filter(id=>BY_ID[id])};}catch(e){}
  return {plan:[],done:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svgTag=id=>`<svg viewBox="${BY_ID[id].S.vb.join(' ')}" data-anim="${id}" aria-hidden="true"></svg>`;

function card(e,mode){
  const sel=state.plan.includes(e.id), done=state.done.includes(e.id);
  const tags=(e.equip.length?[...e.equip].sort():['Ohne Gerät']).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const ctrl=mode==='library'
    ?`<button class="toggle" data-act="toggle" data-id="${e.id}" aria-label="Zum Training">${sel?'✓':'+'}</button>`
    :`<button class="check" data-act="check" data-id="${e.id}" aria-label="Abhaken">✓</button>`;
  return `<div class="ex cat-${e.cat} ${mode==='library'&&sel?'selected':''} ${mode==='training'&&done?'done':''}">
    <button class="fig" data-act="detail" data-id="${e.id}" aria-label="Ausführung ansehen">${svgTag(e.id)}</button>
    <div class="ex-body" data-act="detail" data-id="${e.id}">
      <div class="ex-title">${esc(e.name)}</div>
      <div class="ex-meta">${tags}</div>
    </div>${ctrl}</div>`;
}

function render(){
  document.getElementById('seg').innerHTML=CATEGORIES.map(c=>`<button class="${catFilter===c.id?'active':''}" data-cat="${c.id}">${ICONS[c.id]}${c.label}</button>`).join('');
  document.getElementById('filters').innerHTML=`<button class="chip ${equipFilter?'':'active'}" data-equip="">Alle</button>`+EQUIPMENT.map(q=>`<button class="chip ${equipFilter===q?'active':''}" data-equip="${q}">${q}</button>`).join('');
  const list=EXERCISES.filter(e=>e.cat===catFilter&&(!equipFilter||(equipFilter==='Ohne'?e.equip.length===0:e.equip.includes(equipFilter)))).sort((x,y)=>catFilter==='plyo'?(EQUIPMENT.indexOf(mainEquip(x))-EQUIPMENT.indexOf(mainEquip(y)))||((RANK[x.id]??99)-(RANK[y.id]??99))||x.name.localeCompare(y.name,'de'):((KRANK[x.id]??99)-(KRANK[y.id]??99))||x.name.localeCompare(y.name,'de'));
  document.getElementById('count').textContent=`${list.length} Übung${list.length===1?'':'en'}`;
  document.getElementById('library').innerHTML=list.length?list.map(e=>card(e,'library')).join(''):`<div class="empty">Keine Übung</div>`;
  const plan=state.plan.map(id=>BY_ID[id]).filter(Boolean);
  const dc=plan.filter(e=>state.done.includes(e.id)).length;
  
  document.getElementById('training').innerHTML=plan.length?plan.map(e=>card(e,'training')).join(''):`<div class="empty">Leer</div>`;
  const left=plan.length-dc;
  document.getElementById('progressText').textContent=left?`noch ${left} von ${plan.length}`:`${plan.length} von ${plan.length}`;
  document.getElementById('bar').style.width=plan.length?(dc/plan.length*100)+'%':'0';
  document.getElementById('progressBox').hidden=!plan.length;
  document.getElementById('trainingActions').hidden=!plan.length;
  document.getElementById('doneBanner').style.display=plan.length&&dc===plan.length?'block':'none';
  observe();
}

// Animationen: nur sichtbare Figuren zeichnen
const visible=new Set();
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>en.isIntersecting?visible.add(en.target):visible.delete(en.target)),{rootMargin:'100px'}):null;
function observe(){
  visible.forEach(el=>{if(!el.isConnected)visible.delete(el);});
  document.querySelectorAll('svg[data-anim]').forEach(el=>{if(el._obs)return;el._obs=1;io?io.observe(el):visible.add(el);});
}
let last=0;
function loop(ts){
  if(ts-last>33){last=ts;
    visible.forEach(el=>{const e=BY_ID[el.dataset.anim];if(e&&el.isConnected)el.innerHTML=window.drawFig(e.S,ts);});
  }
  requestAnimationFrame(loop);
}
window.drawFig=(S,t)=>renderFig(S,t);

// Detailansicht
const overlay=document.getElementById('overlay');
function openDetail(id){
  try{window.getSelection().removeAllRanges();}catch(_){}
  const e=BY_ID[id];
  document.getElementById('sheet').innerHTML=`<button class="x" data-act="close" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><div class="big">${svgTag(id)}</div>
    <h2>${esc(e.name)}</h2>
    <div class="ex-meta">${(e.equip.length?[...e.equip].sort():['Ohne Gerät']).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <p>${esc(e.desc)}</p>
`;
  overlay.classList.add('open');observe();
}
overlay.addEventListener('click',ev=>{if(ev.target===overlay)overlay.classList.remove('open');});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.getElementById('view-library').hidden=t.dataset.view!=='library';
  document.getElementById('view-training').hidden=t.dataset.view!=='training';
});
document.body.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-cat]');if(c){catFilter=c.dataset.cat;render();return;}
  const q=ev.target.closest('[data-equip]');if(q){equipFilter=q.dataset.equip;render();return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==='detail'){openDetail(id);return;}
  if(act==='close'){overlay.classList.remove('open');return;}
  if(act==='toggle'){state.plan=state.plan.includes(id)?state.plan.filter(x=>x!==id):[...state.plan,id];state.done=state.done.filter(x=>state.plan.includes(x));}
  if(act==='check'){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];}
  if(b.dataset.close)overlay.classList.remove('open');
  save();render();
});
document.getElementById('resetChecks').onclick=()=>{state.done=[];save();render();};
document.getElementById('clearPlan').onclick=()=>{state.plan=[];state.done=[];save();render();};
// Geräte-Leiste: Ausblenden zeigt, dass man wischen kann
const fl=document.getElementById('filters');
function fade(){const max=fl.scrollWidth-fl.clientWidth;fl.classList.toggle('scrolled',fl.scrollLeft>4);fl.classList.toggle('at-end',fl.scrollLeft>=max-4);}
fl.addEventListener('scroll',fade,{passive:true});window.addEventListener('resize',fade);
render();fade();requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
